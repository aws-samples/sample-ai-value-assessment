name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest -q tests

  package:
    # The CloudFormation buildspec does a non-editable pip install; this is the path customers run.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - run: uv venv "$RUNNER_TEMP/clean" && VIRTUAL_ENV="$RUNNER_TEMP/clean" uv pip install "$RUNNER_TEMP"/dist/*.whl
      - name: Run the installed CLI outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/clean/bin/aiva" --help
          "$RUNNER_TEMP/clean/bin/aiva" audit --help

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx cfn-lint==1.60.1 cloudformation/*.yaml
      - run: shellcheck scripts/*.sh
