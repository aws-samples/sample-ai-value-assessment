# aiva run --config aiva.toml
#
# Every source below is read into one report. Runs with your own AWS
# credentials (laptop or CloudShell) and creates no AWS resources.

region = "ap-southeast-2"   # where aiva calls Bedrock to classify
days = 7
model = "global.anthropic.claude-sonnet-4-6"
output = "report"           # local path or s3://bucket/key, no extension
# format = "all"            # html, md, json, both (html+md) or all
# max_use_cases = 50
# show_samples = false      # true adds raw prompt text to the report

# Bedrock Model Invocation Logs
[[sources]]
type = "bedrock"
bucket = "my-bedrock-invocation-logs"
prefix = ""                 # the key prefix set in Bedrock logging, often empty
# region = "ap-southeast-2" # bucket region, defaults to the region above

# OpenTelemetry exports (Claude Code, Cowork). Only add usage that does not
# run through Bedrock: Bedrock-backed usage is already in the logs above and
# would be counted twice.
# [[sources]]
# type = "otlp"
# bucket = "my-otel-exports"
# prefix = "cowork/"
